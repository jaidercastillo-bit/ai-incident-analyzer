<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Incident Analyzer (Demo)</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; max-width: 900px; }
      label { display:block; font-weight:600; margin-top: 14px; }
      input, textarea { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
      textarea { min-height: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      button { margin-top: 14px; padding: 10px 14px; cursor: pointer; }
      pre { background: #f5f5f5; padding: 12px; overflow:auto; }
      .row { display:flex; gap: 12px; }
      .col { flex:1; }
      .hint { color:#555; font-size: 13px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Incident Analyzer (Demo)</h1>

    <div class="row">
      <div class="col">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" value="http://localhost:3001" />
        <div class="hint">Debe coincidir con tu backend (ya validaste /health).</div>
      </div>
      <div class="col">
        <label for="temperature">Temperature</label>
        <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.2" />
        <div class="hint">Para resultados más consistentes, usa 0.1–0.3.</div>
      </div>
    </div>

    <label for="logs">Logs / Texto del incidente</label>
    <textarea id="logs" placeholder="Pega aquí logs anonimizados..."></textarea>

    <button id="btn">Analizar</button>

    <h2>Respuesta</h2>
    <pre id="out">—</pre>

    <script>
      const btn = document.getElementById("btn");
      const out = document.getElementById("out");

      btn.addEventListener("click", async () => {
        out.textContent = "Analizando...";
        const apiUrl = document.getElementById("apiUrl").value.trim();
        const text = document.getElementById("logs").value;
        const temperature = Number(document.getElementById("temperature").value);

        try {
          const r = await fetch(`${apiUrl}/ai/analyze`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, temperature })
          });

          const data = await r.json().catch(() => ({}));
          out.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          out.textContent = "Error: " + String(e);
        }
      });
    </script>
  </body>
</html>
