<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Incident Analyzer</title>
  <style>
    :root{
      --bg:#070a10;
      --panel: rgba(18, 24, 34, .78);
      --panel2: rgba(12, 17, 27, .82);
      --text:#e8eefc;
      --muted:#93a4b8;
      --line: rgba(255,255,255,.10);
      --accent:#ff4d2e;
      --ok:#3ddc97;
      --bad:#ff5c6c;
      --shadow: 0 12px 40px rgba(0,0,0,.45);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(255,77,46,.26), transparent 55%),
        radial-gradient(900px 500px at 85% 0%, rgba(61,220,151,.18), transparent 60%),
        var(--bg);
      min-height:100vh;
    }
    .wrap{max-width:1100px;margin:0 auto;padding:26px 18px 44px}
    header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }
    .brand{display:flex; gap:12px; align-items:center}
    .brand img{height:34px; object-fit:contain}
    .brand .t{display:flex; flex-direction:column; line-height:1.15}
    .brand .t b{font-size:14px; letter-spacing:.3px}
    .brand .t small{color:var(--muted)}
    .status{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      color: var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .dot{width:8px;height:8px;border-radius:50%}
    .dot.ok{background:var(--ok)}
    .dot.bad{background:var(--bad)}
    .grid{
      display:grid;
      grid-template-columns: 1.1fr 1fr;
      gap:16px;
      margin-top:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow:hidden;
      min-height: 420px;
    }
    .card h3{
      margin:0;
      padding:14px 16px;
      font-size:12px;
      letter-spacing:.6px;
      text-transform:uppercase;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.18);
    }
    .card .body{padding:16px}
    label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
    input, textarea{
      width:100%;
      background: rgba(6,10,16,.55);
      color: var(--text);
      border:1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding:10px 12px;
      outline:none;
    }
    textarea{min-height:210px; resize:vertical}
    .row{display:grid; grid-template-columns: 1fr 1fr; gap:12px}
    .hint{color:var(--muted); font-size:12px; margin-top:6px}
    .actions{display:flex; gap:12px; align-items:center; margin-top:14px}
    button{
      background: var(--accent);
      color: #0b0f14;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor:pointer;
    }
    button:disabled{opacity:.55; cursor:not-allowed}
    .pill{
      color: var(--muted);
      font-size:12px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 10px;
      background: rgba(0,0,0,.15);
    }

    /* Report */
    .empty{color:var(--muted); font-size:14px}
    .error{
      border:1px solid rgba(255,92,108,.35);
      background: rgba(255,92,108,.08);
      color: #ffd5da;
      padding:10px 12px;
      border-radius:12px;
      margin-bottom:12px;
      font-size:13px;
    }
    .section{margin:14px 0 0}
    .section h4{
      margin:0 0 8px;
      font-size:12px;
      letter-spacing:.4px;
      text-transform:uppercase;
      color: var(--muted);
    }
    .kvs{display:grid; gap:8px}
    .kv{
      display:grid;
      grid-template-columns: 190px 1fr;
      gap:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background: rgba(0,0,0,.14);
    }
    .kv b{font-size:12px; color:#cfe0ff}
    .kv div{font-size:13px; color:#e8eefc}
    .list{
      margin:0;
      padding-left:16px;
      color:#e8eefc;
      font-size:13px;
      line-height:1.4;
    }
    .muted{color:var(--muted)}
    .corner-badge{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index: 60;
      pointer-events:none;
    }
    .corner-badge img{
      width:260px;
      max-width:34vw;
      height:auto;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      opacity:.95;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .card{min-height:auto}
      .kv{grid-template-columns: 1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="assets/Connect.jpeg" alt="Connect logo">
        <div class="t">
          <b>Incident Analyzer</b>
          <small>Reporte listo para cliente · Dark UI</small>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot bad" id="dot"></span>
        <span id="statusText">Sin conexión</span>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h3>Configuración</h3>
        <div class="body">
          <label for="apiUrl">API URL (backend público HTTPS)</label>
          <input id="apiUrl" placeholder="https://tu-backend.onrender.com" />

          <div class="row">
            <div>
              <label for="temperature">Temperature</label>
              <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.2" />
              <div class="hint">Consistente: 0.1–0.3</div>
            </div>
            <div>
              <label for="endpoint">Endpoint</label>
              <input id="endpoint" value="/analyze" />
              <div class="hint">Si tu API usa /api/analyze, cámbialo aquí.</div>
            </div>
          </div>

          <label for="logs">Logs / Texto del incidente</label>
          <textarea id="logs" placeholder="Pega aquí logs anonimizados..."></textarea>

          <div class="actions">
            <button id="btn">Analizar</button>
            <span class="pill" id="meta">Listo</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h3>Client report</h3>
        <div class="body" id="report">
          <div class="empty">Aún no hay análisis. Presiona <b>Analizar</b>.</div>
        </div>
      </section>
    </div>
  </div>

  <div class="corner-badge">
    <img src="assets/images.png" alt="Company graphic">
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const statusEl = $("statusText");
    const dotEl = $("dot");
    const metaEl = $("meta");
    const btn = $("btn");
    const report = $("report");

    function setConn(ok, text){
      dotEl.className = "dot " + (ok ? "ok" : "bad");
      statusEl.textContent = text;
    }

    async function checkHealth(){
      const base = $("apiUrl").value.trim().replace(/\/$/, "");
      if(!base){ setConn(false, "Sin conexión"); return; }
      try{
        const r = await fetch(base + "/health", { method: "GET" });
        if(r.ok) setConn(true, "Backend OK");
        else setConn(false, "Backend no OK");
      }catch(e){
        setConn(false, "Sin conexión");
      }
    }

    function safeText(v){
      return (v ?? "").toString();
    }

    function renderClientReport(data){
      // Acepta JSON cualquiera y lo transforma en reporte amigable
      const summary = data.summary || data.resumen || data.title || "";
      const rootCause = data.rootCause || data.cause || data.causa || "";
      const impact = data.impact || data.impacto || "";
      const actions = data.actions || data.recommendations || data.recomendaciones || data.nextSteps || [];
      const evidence = data.evidence || data.logs || [];

      const actionsArr = Array.isArray(actions) ? actions : (actions ? [actions] : []);
      const evidenceArr = Array.isArray(evidence) ? evidence : (evidence ? [evidence] : []);

      report.innerHTML = `
        <div class="section">
          <h4>Resumen</h4>
          <div class="kvs">
            <div class="kv"><b>Hallazgo</b><div>${safeText(summary) || "<span class='muted'>No provisto</span>"}</div></div>
            <div class="kv"><b>Causa probable</b><div>${safeText(rootCause) || "<span class='muted'>No provisto</span>"}</div></div>
            <div class="kv"><b>Impacto</b><div>${safeText(impact) || "<span class='muted'>No provisto</span>"}</div></div>
          </div>
        </div>

        <div class="section">
          <h4>Acciones recomendadas</h4>
          ${
            actionsArr.length
              ? `<ul class="list">${actionsArr.map(a => `<li>${safeText(a)}</li>`).join("")}</ul>`
              : `<div class="muted">No provisto</div>`
          }
        </div>

        <div class="section">
          <h4>Evidencia / Señales</h4>
          ${
            evidenceArr.length
              ? `<ul class="list">${evidenceArr.slice(0,8).map(e => `<li>${safeText(e)}</li>`).join("")}</ul>`
              : `<div class="muted">No provisto</div>`
          }
        </div>
      `;
    }

    function showError(msg){
      report.innerHTML = `<div class="error">Error: ${safeText(msg)}</div>`;
    }

    btn.addEventListener("click", async () => {
      const base = $("apiUrl").value.trim().replace(/\/$/, "");
      const endpoint = $("endpoint").value.trim() || "/analyze";
      const temp = parseFloat($("temperature").value || "0.2");
      const logs = $("logs").value || "";

      if(!base){
        showError("Debes poner un API URL HTTPS (ej: Render).");
        return;
      }

      btn.disabled = true;
      metaEl.textContent = "Analizando...";
      report.innerHTML = `<div class="empty">Procesando...</div>`;

      try{
        const r = await fetch(base + endpoint, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ text: logs, temperature: temp })
        });

        if(!r.ok){
          const t = await r.text().catch(() => "");
          showError(`HTTP ${r.status} ${t}`);
          return;
        }

        const data = await r.json();
        renderClientReport(data);
        metaEl.textContent = "Listo ✅";
      }catch(e){
        showError(e.message || "Failed to fetch");
        metaEl.textContent = "Error";
      }finally{
        btn.disabled = false;
        checkHealth();
      }
    });

    $("apiUrl").addEventListener("change", checkHealth);
    window.addEventListener("load", checkHealth);
  </script>
</body>
</html>
